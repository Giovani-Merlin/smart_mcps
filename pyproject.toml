[project]
name = "smart-mcps"
version = "0.1.0"
description = "NotebookLM, Perplexity, and Codegraph — CLI wrappers and Claude Code skills"
requires-python = ">=3.12"
dependencies = ["httpx", "perplexityai"]

[project.scripts]
smart-mcps-perplexity = "pplx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pplx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
