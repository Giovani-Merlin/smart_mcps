[project]
name = "smart-mcps"
version = "0.1.0"
description = "NotebookLM, Perplexity, and Codegraph — CLI wrappers and Claude Code skills"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "httpx",
    "perplexityai",
    "fastmcp>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.scripts]
smart-mcps-perplexity = "pplx.cli:main"
smart-mcps-codegraph = "codegraph_mcp.server:main"
smart-mcps-orchestrate = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pplx", "codegraph_mcp", "orchestrator"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    # Verification tooling every plan's `Run:` lines invoke as `uv run ruff` /
    # `uv run mdformat`. In the project env so a worker's worktree venv has them,
    # instead of resolving host uv tools off an inherited PATH. The two mdformat
    # plugins pin the same rule set the host tool install carries, so `--check`
    # results are identical in and out of the sandbox.
    "ruff>=0.15",
    "mdformat>=1.0",
    "mdformat-gfm>=1.0",
    "mdformat-frontmatter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned to ruff's classic default set. ruff 0.16 widened its defaults (S, PLW, UP,
# SIM, PERF, ...), so an unpinned `ruff check` reports ~50 findings on a tree that
# is clean under 0.15 — and every plan's "Pass: ruff clean" would flip on a version
# bump rather than on a code change. Widen deliberately, in its own change.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from a sibling test module are *used* by name as test
# parameters; ruff reads that as "redefinition of unused import" (F811).
"tests/*" = ["F811"]

[tool.pytest.ini_options]
markers = ["llm: opt-in LLM-in-the-loop test (excluded by default, see R26)"]
addopts = "-m \"not llm\""
