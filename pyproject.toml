[project]
name = "smart-mcps"
version = "0.1.0"
description = "AgentMemory, NotebookLM, Perplexity, and Codegraph MCP servers"
requires-python = ">=3.12"
dependencies = ["fastmcp", "httpx"]

[project.scripts]
smart-mcps-agentmemory = "agentmemory.proxy:main"

[tool.hatch.build.targets.wheel]
packages = ["agentmemory"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
