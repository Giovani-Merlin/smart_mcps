[project]
name = "smart-mcps"
version = "0.1.0"
description = "NotebookLM, Perplexity, and Codegraph — CLI wrappers and Claude Code skills"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "httpx",
    "perplexityai",
    "fastmcp>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.scripts]
smart-mcps-perplexity = "pplx.cli:main"
smart-mcps-codegraph = "codegraph_mcp.server:main"
smart-mcps-orchestrate = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pplx", "codegraph_mcp", "orchestrator"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = ["llm: opt-in LLM-in-the-loop test (excluded by default, see R26)"]
addopts = "-m \"not llm\""
